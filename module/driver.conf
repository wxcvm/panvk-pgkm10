# PanVK WSI7 module configuration.
#
# enable_global: 0 = OEM Vulkan for everything (default), 1 = enable the experimental ICD.
# Toggle with the module Action button, then reboot.
#
# scope:
#   apps  = bind the ICD + ColorX copy into the app spawn namespaces (zygote/usap) only.
#           SurfaceFlinger, system_server and other system processes keep the OEM driver.
#           This is the recommended mode.
#   system = bind into the init namespace at post-fs-data (all processes, including
#           SurfaceFlinger). NOT recommended: with 10-bit compressed video content the
#           boot/unlock screen can abort in SurfaceFlinger (RenderEngine P010 texture).
enable_global=0
scope=apps
acq_replay=1
afbc_align=1
